        >
        <img
            src="images/originals/2022 - drawing-arms.jpg"
            data-full="images/originals/2022 - drawing-arms.jpg"
            class="gallery-img"
            loading="lazy"
            decoding="async"
        >
        <img
            src="images/originals/2022-02-01 - drawing-cat.jpg"
            data-full="images/originals/2022-02-01 - drawing-cat.jpg"
            class="gallery-img"
            loading="lazy"
            decoding="async"
        >
        <img
            src="images/originals/2022-05 - etching-jonah.jpg"
            data-full="images/originals/2022-05 - etching-jonah.jpg"
            class="gallery-img"
            loading="lazy"
            decoding="async"
        >
        <img
            src="images/originals/2022-04 - etching-cat.jpg"
            data-full="images/originals/2022-04 - etching-cat.jpg"
            class="gallery-img"
            loading="lazy"

        >
        <img
            src="images/originals/2022-05-16 - lino-bedroom.jpg"
            data-full="images/originals/2022-05-16 - lino-bedroom.jpg"
            class="gallery-img"

            decoding="async"
        >
        <img
            src="images/originals/2022 - drawing-golliwog.jpg"
            data-full="images/originals/2022 - drawing-golliwog.jpg"
            class="gallery-img"
            loading="lazy"
            decoding="async"
        >
        <img
            src="images/originals/2022 - lino-naked-woman.jpg"
            data-full="images/originals/2022 - lino-naked-woman.jpg"
            class="gallery-img"
            loading="lazy"
            decoding="async"
        >

    <div id="lightbox" class="lightbox">
        <button id="prev" type="button">◀</button>
        <div class="lightbox-content">
            <div class="lightbox-image-wrap">
                <img id="lightbox-img" src="">
                <div id="mobile-prev" class="mobile-tap-zone mobile-tap-left"></div>
                <div id="mobile-next" class="mobile-tap-zone mobile-tap-right"></div>
            </div>
            <div id="lightbox-caption"></div>
        </div>
        <button id="next" type="button">▶</button>
    </div>

    <hr>

    <p>
        Created: 2026-09-13
        <br>
        Last updated: 2026-09-14
    </p>
    <script>
    const images = [...document.querySelectorAll('.gallery-img')];
    const lightbox = document.querySelector('#lightbox');
    const lightboxImg = document.querySelector('#lightbox-img');
    const lightboxCaption = document.querySelector('#lightbox-caption');

    const prevButton = document.querySelector('#prev');
    const nextButton = document.querySelector('#next');

    const mobilePrev = document.querySelector('#mobile-prev');
    const mobileNext = document.querySelector('#mobile-next');

    let current = 0;

    function showImage(index) {
        current = (index + images.length) % images.length;

        lightboxImg.src = images[current].dataset.full;
        lightboxImg.alt = images[current].alt;
        lightboxCaption.textContent = images[current].alt;

        lightbox.classList.add('open');
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
    }

    function previousImage() {
        showImage(current - 1);
    }

    function nextImage() {
        showImage(current + 1);
    }

    // Open lightbox from gallery
    images.forEach((img, i) => {
        img.addEventListener('click', () => {
            showImage(i);
        });
    });

    // Desktop arrows
    prevButton.addEventListener('click', previousImage);
    nextButton.addEventListener('click', nextImage);

    // Mobile tap zones
    mobilePrev.addEventListener('click', previousImage);
    mobileNext.addEventListener('click', nextImage);

    // Keyboard navigation
    document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('open')) return;

        if (e.key === 'ArrowLeft') {
            previousImage();
        }

        if (e.key === 'ArrowRight') {
            nextImage();
        }

        if (e.key === 'Escape') {
            closeLightbox();
        }
    });

    // Click dark background to close
    lightbox.addEventListener('click', e => {
        if (e.target === lightbox) {
            closeLightbox();
        }
    });
    </script>

</body>

</html>
